name: mem0-dev

services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    ports:
      - "8877:8000"
    env_file:
      - .env
    networks:
      - mem0_network
      - services-net
    volumes:
      - ./history:/app/history
      - .:/app
    # 使用宿主机已有的 Postgres(services-net 网络,容器名 postgres)。
    # 启动前需保证 postgres 容器已加入 services-net。
    # 必须用列表形式:折叠字符串里 "ollama>=0.4,<1.0" 的内层引号会让 compose
    # 把 sh -c 脚本在 ollama 处截断,导致 uvicorn 永远不会启动,容器装完依赖即 exit 0。
    command:
      - sh
      - -c
      - rm -rf /app/packages && pip install -q --force-reinstall --no-deps -i https://mirrors.aliyun.com/pypi/simple/ mem0ai && pip install -q -i https://mirrors.aliyun.com/pypi/simple/ "ollama>=0.4,<1.0" && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # 启动命令每次都要 pip install + alembic,给足预热时间
      start_period: 120s
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - DASHBOARD_URL=https://memory.cone387.top
      - APP_DB_NAME=mem0_app
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-true}

  mem0-dashboard:
    build: ./dashboard
    ports:
      - "4433:3000"
    networks:
      - mem0_network
    environment:
      - NEXT_PUBLIC_API_URL=https://memory.cone387.top/api
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    depends_on:
      mem0:
        # 等 API 真正健康再起 dashboard,避免开机窗口期登录 502
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: m.daocloud.io/docker.io/ollama/ollama:latest
    container_name: mem0-ollama
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - mem0_network
    # 不暴露宿主机端口,仅供 mem0 容器内网访问
    restart: unless-stopped

volumes:
  ollama_models:

networks:
  mem0_network:
    driver: bridge
  services-net:
    external: true
